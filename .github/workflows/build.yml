name: Build REM Client

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Unpack source zip (if uploaded as a zip)
        run: |
          if [ -f rem-client-source.zip ]; then unzip -o rem-client-source.zip; fi
          ls

      - name: Build jar
        working-directory: REMClient-build
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: rem-client-jar
          path: REMClient-build/build/libs/rem-client-0.1.0.jar
